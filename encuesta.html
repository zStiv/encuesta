
<!DOCTYPE html>
<html>
<head>
<title>Sitios Turisticos</title>
</head>
<body>

<h1>SITIOS TURISTICOS DEL ECUADOR</h1>
<p>Datos del encuestado</p>

<form>
  <label for="fname">1.- Cual es su nombre?</label><br>
  <input type="text" id="fname" name="fname"><br>

  <br>

  <label for="quantity">2.- Ingrese su edad (1-99):</label><br>
  <input type="number" id="quantity" name="quantity" min="1" max="99"><br>

  <br>

  <label for="city">3.- De que ciudad nos visita?</label><br>
  <input type="text" id="city" name="city"><br>

  <br>

  <label>4.- Con que frecuencia visita sitios turisticos?</label><br>
  <input type="radio" id="primera_vez" name="frecuencia" value="Primera Vez">
  <label for="primera_vez">Primera Vez</label><br>

  <input type="radio" id="ocasionalmente" name="frecuencia" value="Ocasionalmente">
  <label for="ocasionalmente">Ocasionalmente</label><br>

  <input type="radio" id="frecuentemente" name="frecuencia" value="Frecuentemente">
  <label for="frecuentemente">Frecuentemente</label><br>

  <br>

  <label>5.- Que sitio le interesa visitar?</label><br>
  <input type="radio" id="volcan" name="lugar" value="Volcan Cotopaxi">
  <label for="volcan">Volcan Cotopaxi</label><br>

  <input type="radio" id="laguna" name="lugar" value="Laguna Quilotoa">
  <label for="laguna">Laguna de Quilotoa</label><br>

  <input type="radio" id="banos" name="lugar" value="Banos de Agua Santa">
  <label for="banos">Banos de Agua Santa</label><br>

  <input type="radio" id="mitad" name="lugar" value="Mitad del Mundo">
  <label for="mitad">Mitad del Mundo</label><br>

  <br>

  <label>6.- Que actividades le gustaria realizar?</label><br>
  <input type="checkbox" id="a1" name="senderismo" value="Senderismo">
  <label for="a1">Senderismo</label><br>

  <input type="checkbox" id="a2" name="camping" value="Camping">
  <label for="a2">Camping</label><br>

  <input type="checkbox" id="a3" name="fotografia" value="Fotografia">
  <label for="a3">Fotografia</label><br>

  <input type="checkbox" id="a4" name="observacion" value="Observacion de flora y fauna">
  <label for="a4">Observacion de flora y fauna</label><br>

  <input type="checkbox" id="a5" name="ciclismo" value="Ciclismo">
  <label for="a5">Ciclismo</label><br>

  <input type="checkbox" id="a6" name="visitas" value="Visitas guiadas">
  <label for="a6">Visitas guiadas</label><br>

  <br>

  <label>7.- Que medio de transporte utilizaria?</label><br>
  <input type="radio" id="vehiculo" name="transporte" value="Vehiculo particular">
  <label for="vehiculo">Vehiculo particular</label><br>

  <input type="radio" id="autobus" name="transporte" value="Autobus">
  <label for="autobus">Autobus</label><br>

  <input type="radio" id="turistico" name="transporte" value="Transporte turistico">
  <label for="turistico">Transporte turistico</label><br>

  <input type="radio" id="moto" name="transporte" value="Motocicleta">
  <label for="moto">Motocicleta</label><br>

  <br>

  <label>8.- Como calificaria su experiencia turistica?</label><br>
  <input type="radio" id="excelente" name="calificacion" value="Excelente">
  <label for="excelente">Excelente</label><br>

  <input type="radio" id="bueno" name="calificacion" value="Bueno">
  <label for="bueno">Bueno</label><br>

  <input type="radio" id="regular" name="calificacion" value="Regular">
  <label for="regular">Regular</label><br>

  <input type="radio" id="malo" name="calificacion" value="Malo">
  <label for="malo">Malo</label><br>

  <br>

  <label>9.- Que servicios considera importantes?</label><br>
  <input type="checkbox" id="s1" name="senderos" value="Senderos">
  <label for="s1">Senderos</label><br>

  <input type="checkbox" id="s2" name="banos" value="Banos publicos">
  <label for="s2">Banos publicos</label><br>

  <input type="checkbox" id="s3" name="restaurantes" value="Restaurantes">
  <label for="s3">Restaurantes</label><br>

  <input type="checkbox" id="s4" name="parqueaderos" value="Parqueaderos">
  <label for="s4">Parqueaderos</label><br>

  <input type="checkbox" id="s5" name="guias" value="Guias turisticos">
  <label for="s5">Guias turisticos</label><br>

  <br>

  <label>10.- Cuanto dinero estaria dispuesto a gastar?</label><br>
  <input type="radio" id="g1" name="gasto" value="Menos de 20">
  <label for="g1">Menos de $20</label><br>

  <input type="radio" id="g2" name="gasto" value="20 a 50">
  <label for="g2">De $20 a $50</label><br>

  <input type="radio" id="g3" name="gasto" value="51 a 100">
  <label for="g3">De $51 a $100</label><br>

  <input type="radio" id="g4" name="gasto" value="Mas de 100">
  <label for="g4">Mas de $100</label><br>

  <br>

  <label>11.- Recomendaria este sitio turistico?</label><br>
  <input type="radio" id="si" name="recomendacion" value="Si">
  <label for="si">Si</label><br>

  <input type="radio" id="no" name="recomendacion" value="No">
  <label for="no">No</label><br>

  <input type="radio" id="talvez" name="recomendacion" value="Tal vez">
  <label for="talvez">Tal vez</label><br>

  <br>

  <label for="mejoras">12.- Que mejoras le gustaria que se implementaran?</label><br>
  <textarea id="mejoras" name="mejoras" rows="4" cols="40"></textarea><br>

  <br>

  <label for="comentarios">13.- Que es lo que mas le gusta de los sitios turisticos?</label><br>
  <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea><br>

  <br>

  <input type="submit" value="Enviar encuesta">

</form>

</body>
</html>
```
